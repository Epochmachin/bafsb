name: Android APK

# Builds the Android APK in the cloud when android/ changes (or by hand), and publishes it as Release "app-latest".
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BAFSB.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest BAFSB.apk \
            --title "BAFSB app (build ${{ github.run_number }})" \
            --notes "Download this APK on the phone and install it."
